<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b4332" />
      <stop offset="100%" stop-color="#0d281e" />
    </linearGradient>
    <linearGradient id="leafGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>
    <linearGradient id="leafGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#86efac" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Circular Badge with Golden Border -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)" stroke="#d97706" stroke-width="2.5" />
  <circle cx="32" cy="32" r="27.5" fill="none" stroke="#fef08a" stroke-width="0.8" stroke-opacity="0.4" />

  <!-- Heritage Plant & Millet Motif -->
  <g filter="url(#shadow)">
    <!-- Central Curved Stem -->
    <path d="M32 50 C32 38 31 28 32 16" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />

    <!-- Top Center Leaf / Grain Tip -->
    <path d="M32 14 C30 18 30 22 32 25 C34 22 34 18 32 14 Z" fill="url(#leafGrad2)" stroke="#14532d" stroke-width="0.5" />

    <!-- Upper Right Leaf -->
    <path d="M32 23 C38 21 44 24 45 30 C39 31 34 28 32 25 Z" fill="url(#leafGrad1)" stroke="#14532d" stroke-width="0.5" />

    <!-- Upper Left Leaf -->
    <path d="M32 27 C26 25 20 28 19 34 C25 35 30 32 32 29 Z" fill="url(#leafGrad2)" stroke="#14532d" stroke-width="0.5" />

    <!-- Lower Right Leaf -->
    <path d="M32 33 C39 32 46 37 46 43 C39 43 34 39 32 35 Z" fill="url(#leafGrad1)" stroke="#14532d" stroke-width="0.5" />

    <!-- Lower Left Leaf -->
    <path d="M32 37 C25 36 18 41 18 47 C25 47 30 43 32 39 Z" fill="url(#leafGrad2)" stroke="#14532d" stroke-width="0.5" />

    <!-- Golden Millet / Grain Accents -->
    <circle cx="32" cy="14" r="2.2" fill="url(#goldGrad)" />
    <circle cx="45" cy="30" r="1.8" fill="url(#goldGrad)" />
    <circle cx="19" cy="34" r="1.8" fill="url(#goldGrad)" />
  </g>
</svg>
